name: ActionOS Pay CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: 1. Static Analysis & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

  security-and-adversarial-tests:
    name: 2. Financial Integrity & Adversarial Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites (Vitest)
        run: npm test

  database-migrations-validation:
    name: 3. Database Migration Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Migration Schema Files
        run: |
          echo "Verifying forward migration files..."
          test -f supabase/migrations/00001_initial_schema.sql || exit 1
          test -f supabase/migrations/00002_atomic_reconciliation.sql || exit 1
          test -f supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          echo "Checking essential stored procedures..."
          grep -q "reconcile_payment_capture_atomic" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          grep -q "claim_expired_webhook_events_for_worker" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          grep -q "dead_letter_exhausted_webhook_events" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          grep -q "recover_expired_webhook_claims" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          grep -q "persist_quote_and_transition_request_atomic" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          grep -q "persist_approval_and_transition_atomic" supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          echo "Migration integrity verified."

  production-build:
    name: 4. Next.js Production Build Gate
    needs: [static-analysis, security-and-adversarial-tests, database-migrations-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build (next build)
        run: npm run build
