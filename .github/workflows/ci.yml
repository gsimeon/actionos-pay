name: ActionOS Pay CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: 1. Static Analysis & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

  security-and-adversarial-tests:
    name: 2. Financial Integrity & Adversarial Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites (Vitest)
        run: npm test

  database-migrations-validation:
    name: 3. Database Migration & PostgreSQL Acceptance Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: actionos_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Migration Schema Files
        run: |
          echo "Verifying forward migration files..."
          test -f supabase/migrations/00001_initial_schema.sql || exit 1
          test -f supabase/migrations/00002_atomic_reconciliation.sql || exit 1
          test -f supabase/migrations/00003_financial_integrity_hardening.sql || exit 1
          test -f supabase/migrations/00004_financial_controls_and_authorization.sql || exit 1
          test -f supabase/migrations/00005_production_security_and_identity_binding.sql || exit 1
          test -f supabase/migrations/00006_production_acceptance_and_reconciliation.sql || exit 1
          echo "Checking essential stored procedures in migration 00006..."
          grep -q "reconcile_payment_capture_atomic" supabase/migrations/00006_production_acceptance_and_reconciliation.sql || exit 1
          grep -q "claim_webhook_event" supabase/migrations/00006_production_acceptance_and_reconciliation.sql || exit 1
          grep -q "persist_approval_and_transition_atomic" supabase/migrations/00006_production_acceptance_and_reconciliation.sql || exit 1
          echo "Migration integrity verified."

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Execute Clean Standalone PostgreSQL Migration Upgrade (00001 -> 00002 -> 00003 -> 00004 -> 00005 -> 00006)
        env:
          PGPASSWORD: test_password
        run: |
          echo "Applying 00001_initial_schema.sql to clean PostgreSQL database (validating autonomous bootstrap)..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00001_initial_schema.sql
          echo "Applying 00002_atomic_reconciliation.sql..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00002_atomic_reconciliation.sql
          echo "Applying 00003_financial_integrity_hardening.sql..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00003_financial_integrity_hardening.sql
          echo "Applying 00004_financial_controls_and_authorization.sql..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00004_financial_controls_and_authorization.sql
          echo "Applying 00005_production_security_and_identity_binding.sql (Phase 9 Upgrade)..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00005_production_security_and_identity_binding.sql
          echo "Applying 00006_production_acceptance_and_reconciliation.sql (Phase 10 Upgrade)..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f supabase/migrations/00006_production_acceptance_and_reconciliation.sql
          echo "All migrations applied successfully to live PostgreSQL 15."

      - name: Run Live PostgreSQL Acceptance & RPC Test Suite
        env:
          PGPASSWORD: test_password
        run: |
          echo "Executing live PostgreSQL acceptance & rollback test suite..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f tests/db/test-migrations-and-rpcs.sql
          echo "PostgreSQL Acceptance Suite Passed 100%."

      - name: Run Live PostgreSQL Role Permission & Boundary Test Suite
        env:
          PGPASSWORD: test_password
        run: |
          echo "Executing live PostgreSQL role permission & boundary test suite..."
          psql -h localhost -U test_user -d actionos_test -v ON_ERROR_STOP=1 -f tests/db/test-role-permissions.sql
          echo "PostgreSQL Role Boundary Suite Passed 100%."

      - name: Setup Node.js 20.x for Concurrency Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live Multi-Session PostgreSQL Concurrency Test Suite
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/actionos_test
        run: |
          echo "Executing live multi-session PostgreSQL concurrency test suite..."
          npm run test:db:concurrency
          echo "Live Multi-Session Concurrency Gate Passed 100%."

  production-build:
    name: 4. Next.js Production Build Gate
    needs: [static-analysis, security-and-adversarial-tests, database-migrations-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build (next build)
        run: npm run build
