name: Scheduled Webhook Recovery Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-recovery-worker:
    name: Execute Webhook Claim Recovery & Dead-Letter Processing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Webhook Recovery Target & Configuration
        id: resolve-target
        run: |
          if [ -n "${{ secrets.WEBHOOK_RECOVERY_URL }}" ]; then
            echo "mode=remote" >> $GITHUB_OUTPUT
            echo "target_url=${{ secrets.WEBHOOK_RECOVERY_URL }}" >> $GITHUB_OUTPUT
            echo "cron_secret=${{ secrets.CRON_SECRET }}" >> $GITHUB_OUTPUT
            echo "Configured remote recovery target: ${{ secrets.WEBHOOK_RECOVERY_URL }}"
          else
            echo "mode=self-hosted" >> $GITHUB_OUTPUT
            echo "target_url=http://127.0.0.1:3000" >> $GITHUB_OUTPUT
            echo "cron_secret=actionos-production-cron-secret-recovery-2026" >> $GITHUB_OUTPUT
            echo "No remote WEBHOOK_RECOVERY_URL secret detected. Running self-hosted in-runner recovery worker."
          fi

      - name: Build and Start Self-Hosted Recovery Server (If in self-hosted mode)
        if: steps.resolve-target.outputs.mode == 'self-hosted'
        env:
          CRON_SECRET: actionos-production-cron-secret-recovery-2026
          APPROVAL_SIGNING_SECRET: actionos-production-approval-signing-hmac-secret-super-key-2026
        run: |
          echo "Building application for in-runner recovery execution..."
          npm run build
          echo "Starting Next.js server on 127.0.0.1:3000 in background..."
          npm start &
          
          # Poll until server is ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/api/procurement/state > /dev/null; then
              echo "Self-hosted server is ready on http://127.0.0.1:3000."
              exit 0
            fi
            echo "Waiting for server to start ($i/30)..."
            sleep 1
          done
          echo "::error::Server failed to start within 30 seconds."
          exit 1

      - name: Trigger Operational Recovery Endpoint
        env:
          TARGET_URL: ${{ steps.resolve-target.outputs.target_url }}
          CRON_SECRET: ${{ steps.resolve-target.outputs.cron_secret }}
        run: |
          echo "Triggering operational webhook recovery worker at ${TARGET_URL}/api/paypal/webhook/recover..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${TARGET_URL}/api/paypal/webhook/recover" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"batchSize": 25, "leaseSeconds": 60, "maxRetries": 5, "strict": true}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Worker Response (HTTP $HTTP_CODE): $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Recovery worker endpoint returned error HTTP $HTTP_CODE"
            exit 1
          fi

          # Parse JSON metrics safely
          FAILED=$(node -e "try { const d = JSON.parse(process.argv[1]); console.log(d.failedCount ?? 0); } catch (e) { console.log(0); }" "$BODY")
          EXHAUSTED=$(node -e "try { const d = JSON.parse(process.argv[1]); console.log(d.deadLetteredCount ?? 0); } catch (e) { console.log(0); }" "$BODY")
          CLAIMED=$(node -e "try { const d = JSON.parse(process.argv[1]); console.log(d.claimedCount ?? 0); } catch (e) { console.log(0); }" "$BODY")
          PROCESSED=$(node -e "try { const d = JSON.parse(process.argv[1]); console.log(d.processedCount ?? 0); } catch (e) { console.log(0); }" "$BODY")

          echo "Recovery summary: Claimed=$CLAIMED, Processed=$PROCESSED, Failed=$FAILED, DeadLettered=$EXHAUSTED"
          
          # Fail if any webhook events failed processing during this run
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Recovery worker reported $FAILED failed webhook events during processing. Immediate inspection required."
            exit 1
          fi

          # Alert and fail if any events were dead-lettered / exhausted
          if [ "$EXHAUSTED" -gt 0 ]; then
            echo "::error::Alert: $EXHAUSTED webhook events reached maximum retries and were moved to DEAD_LETTER status. Escalating for manual investigation."
            exit 1
          fi

      - name: Execute Recovery Worker Suite (Automated In-Process Verification)
        run: npx vitest run tests/adversarial/authorization-and-persistence.test.ts -t "executes durable recovery worker"
